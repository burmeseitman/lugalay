name: build

# Push a tag to cut a release:  git tag v1.0.0 && git push origin v1.0.0
# Every push and PR still builds, so a break is caught before tagging.
on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read           # default to read; release job overrides to write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false     # one platform breaking must not hide the others
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            label: macOS (Apple Silicon)
            artifact: Lugalay-macos-arm64
          - os: macos-latest
            arch: x64
            label: macOS (Intel)
            artifact: Lugalay-macos-x86_64
          - os: windows-latest
            arch: x64
            label: Windows
            artifact: Lugalay-windows-x86_64
          - os: ubuntu-22.04
            arch: x64
            label: Linux
            artifact: Lugalay-linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # audio wheels lag the newest CPython
          architecture: ${{ matrix.arch }}

      # ---- system libraries the audio and webview stacks need ----
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            portaudio19-dev libasound2-dev libsndfile1 espeak-ng \
            libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.0 \
            libcairo2-dev pkg-config python3-dev meson ninja-build \
            libssl-dev libgtk-3-dev
          sudo apt-get install -y gir1.2-webkit2-4.1 || true

      - name: macOS system packages
        if: runner.os == 'macOS'
        run: brew install portaudio libsndfile

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r agent/voice/requirements.txt
          pip install pyinstaller
        shell: bash

      - name: Linux GTK bindings for pywebview
        if: runner.os == 'Linux'
        run: |
          pip install pycairo
          pip install pygobject || sudo apt-get install -y python3-gi python3-gi-cairo

      - name: Windows WebView2 bindings for pywebview
        if: runner.os == 'Windows'
        run: pip install pythonnet cefpython3 || pip install pythonnet

      # ---- icons: generated, so the repo carries no binaries ----
      - name: Build icons
        run: python packaging/make_icons.py
        shell: bash

      - name: Sanity check — everything imports and parses
        run: python packaging/preflight.py
        shell: bash

      - name: Build
        env:
          LUGALAY_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        run: pyinstaller --noconfirm --clean packaging/lugalay.spec
        shell: bash

      # ---- package one file per platform ----
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          chmod -R u+w Lugalay.app || true
          if [ -d "Lugalay.app/Contents/Frameworks" ]; then
              find Lugalay.app/Contents/Frameworks -type f \( -name "*.dylib" -o -name "*.so" \) -print0 | xargs -0 -n 1 codesign --force -s - 2>/dev/null || true
          fi
          if [ -f "Lugalay.app/Contents/MacOS/Lugalay" ]; then
              codesign --force -s - "Lugalay.app/Contents/MacOS/Lugalay" || true
          fi
          codesign --force -s - Lugalay.app || true
          hdiutil create -volname Lugalay -srcfolder Lugalay.app \
            -ov -format UDZO "${{ matrix.artifact }}.dmg"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Lugalay/* -DestinationPath "dist/${{ matrix.artifact }}.zip"
        shell: pwsh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar czf "${{ matrix.artifact }}.tar.gz" Lugalay

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to create the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: What are we releasing
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Install

            | platform | file | first launch |
            |---|---|---|
            | macOS | `.dmg` | drag to Applications, then **right-click → Open** (unsigned) |
            | Windows | `.zip` | unzip, run `Lugalay.exe`; SmartScreen → More info → Run anyway |
            | Linux | `.tar.gz` | extract, run `./Lugalay` |

            ### Brain & Intelligence

            Lugalay supports:
            * **OpenAI Codex CLI** (`codex` - runs on your ChatGPT / Codex Plus subscription)
            * **Claude Code** (`claude` - `npm install -g @anthropic-ai/claude-code`)
            * **Local Offline Models** (Ollama: `qwen3.6`, `llama3`)
            * **Hosted APIs** (Gemini, OpenAI GPT-4o, DeepSeek, Groq)

            ### First run

            The app asks your name, assistant name, and language settings, then
            downloads the local speech models. Free Edge-TTS and Gemini 2.5 Flash TTS
            are supported for Burmese voice output.
